  player-only: "<red>Эта команда доступна только игрокам."
  invalid-args: "<red>Использование: {usage}"
  unknown-subcommand: "<red>Неизвестная подкоманда. Попробуйте <yellow>/f help</yellow>."
  faction-not-found: "<red>Фракция <yellow>{name}</yellow> не найдена."
  player-not-found: "<red>Игрок <yellow>{name}</yellow> не найден."
