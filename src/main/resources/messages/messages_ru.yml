  start-step-2: "<gray>2) <white>/f invite <player></white> <dark_gray>- Пригласите союзников"
  start-step-3: "<gray>3) <white>/f claim</white> <dark_gray>- Займите первый чанк"
  start-step-4: "<gray>4) <white>/f sethome</white> <dark_gray>- Установите базу фракции"
  separator: "<dark_gray>----------------------------------------"
  section:
    core: "<gold>Основное</gold>"
    faction-setup: "<gold>Настройка фракции</gold>"
    members-and-invites: "<gold>Участники & Приглашения</gold>"
    land-and-navigation: "<gold>Земли & Навигация</gold>"
    economy-and-utility: "<gold>Экономика & Утилиты</gold>"
