gui:
  enabled: true
  default-menu: main
  language-menu: language
  menus:
    main:
      title: "<gradient:#f6d365:#fda085><bold>Factions Control</bold></gradient>"
      size: 54
      items:
        info:
          slot: 10
          material: BOOK
          name: "<gold><bold>Your Faction</bold></gold>"
          lore:
            - "<gray>Faction: <white>{faction}</white>"
            - "<gray>Members: <white>{faction_members}</white>"
            - "<gray>Land: <white>{faction_land}</white>"
            - "<gray>Bank: <white>${faction_bank}</white>"
            - "<dark_gray>Open detailed faction info"
          action: RUN_COMMAND
          command: "/f info"
        map:
          slot: 12
          material: FILLED_MAP
          name: "<aqua><bold>Territory Map</bold></aqua>"
          lore:
            - "<gray>Open a live territorial map."
            - "<dark_gray>Click to run /f map"
          action: RUN_COMMAND
          command: "/f map"
        claim:
          slot: 14
          material: GRASS_BLOCK
          name: "<green><bold>Claim Current Chunk</bold></green>"
          lore:
            - "<gray>Claim where you are standing."
            - "<dark_gray>Fast claim action"
          action: RUN_COMMAND
          command: "/f claim"
        unclaim:
          slot: 16
          material: BARRIER
          name: "<red><bold>Unclaim Current Chunk</bold></red>"
          lore:
            - "<gray>Unclaim where you are standing."
            - "<dark_gray>Fast unclaim action"
          action: RUN_COMMAND
          command: "/f unclaim"
        invites:
          slot: 28
          material: WRITABLE_BOOK
          name: "<yellow><bold>Invitations</bold></yellow>"
          lore:
            - "<gray>Review and accept pending invites."
            - "<dark_gray>Opens invite list"
          action: RUN_COMMAND
          command: "/f join"
        home:
          slot: 30
          material: LODESTONE
          name: "<gold><bold>Faction Home</bold></gold>"
          lore:
            - "<gray>Teleport to your faction home."
            - "<dark_gray>Click to run /f home"
          action: RUN_COMMAND
          command: "/f home"
        warps:
          slot: 32
          material: ENDER_PEARL
          name: "<light_purple><bold>Warps</bold></light_purple>"
          lore:
            - "<gray>View and use faction warps."
            - "<dark_gray>Click to run /f warp list"
          action: RUN_COMMAND
          command: "/f warp list"
        top:
          slot: 34
          material: NETHER_STAR
          name: "<#3ddad7><bold>Top Factions</bold></#3ddad7>"
          lore:
            - "<gray>Open the faction leaderboard."
            - "<dark_gray>Click to run /f top"
          action: RUN_COMMAND
          command: "/f top"
        language:
          slot: 46
          material: GLOBE_BANNER_PATTERN
          name: "<aqua><bold>Language</bold></aqua>"
          lore:
            - "<gray>Current: <white>{language_current}</white>"
            - "<gray>Default: <white>{language_default}</white>"
            - "<dark_gray>Open language selector"
          action: OPEN_MENU
          menu: language
        your-power:
          slot: 49
          material: PLAYER_HEAD
          name: "<white><bold>{player}</bold></white>"
          glow: true
          lore:
            - "<gray>Power: <white>{power}</white><gray>/<white>{max_power}</white>"
            - "<dark_gray>Personal faction status"
          action: REFRESH
        close:
          slot: 53
          material: STRUCTURE_VOID
          name: "<red><bold>Close</bold></red>"
          lore:
            - "<gray>Close this menu."
          action: CLOSE
    language:
      title: "<gradient:#84fab0:#8fd3f4><bold>Language Selection</bold></gradient>"
      size: 54
      items:
        language-status:
          slot: 4
          material: GLOBE_BANNER_PATTERN
          name: "<aqua><bold>Language</bold></aqua>"
          lore:
            - "<gray>Current: <white>{language_current}</white>"
            - "<gray>Default: <white>{language_default}</white>"
            - "<gray>Available: <white>{language_available}</white>"
          action: REFRESH
        language-en:
          slot: 19
          material: WHITE_BANNER
          name: "<green><bold>English (en)</bold></green>"
          lore:
            - "<gray>Set your language to English"
          action: LANGUAGE_SET
          locale: "en"
        language-es:
          slot: 20
          material: RED_BANNER
          name: "<green><bold>Español (es)</bold></green>"
          lore:
            - "<gray>Set your language to Spanish"
          action: LANGUAGE_SET
          locale: "es"
        language-de:
          slot: 21
          material: BLACK_BANNER
          name: "<green><bold>Deutsch (de)</bold></green>"
          lore:
            - "<gray>Set your language to German"
          action: LANGUAGE_SET
          locale: "de"
        language-fr:
          slot: 22
          material: BLUE_BANNER
          name: "<green><bold>Français (fr)</bold></green>"
          lore:
            - "<gray>Set your language to French"
          action: LANGUAGE_SET
          locale: "fr"
        language-ptbr:
          slot: 23
          material: GREEN_BANNER
          name: "<green><bold>Português (pt-BR)</bold></green>"
          lore:
            - "<gray>Set your language to Brazilian Portuguese"
          action: LANGUAGE_SET
          locale: "pt-BR"
        language-zh:
          slot: 24
          material: RED_BANNER
          name: "<green><bold>Chinese (zh)</bold></green>"
          lore:
            - "<gray>Set your language to Chinese"
          action: LANGUAGE_SET
          locale: "zh"
        language-ru:
          slot: 25
          material: BLUE_BANNER
          name: "<green><bold>Russian (ru)</bold></green>"
          lore:
            - "<gray>Set your language to Russian"
          action: LANGUAGE_SET
          locale: "ru"
        language-ja:
          slot: 31
          material: WHITE_BANNER
          name: "<green><bold>Japanese (ja)</bold></green>"
          lore:
            - "<gray>Set your language to Japanese"
          action: LANGUAGE_SET
          locale: "ja"
        language-reset:
          slot: 49
          material: FEATHER
          name: "<yellow><bold>Reset Language</bold></yellow>"
          lore:
            - "<gray>Use server default locale"
            - "<dark_gray>Equivalent to /f language reset"
          action: LANGUAGE_RESET
        back:
          slot: 45
          material: ARROW
          name: "<yellow><bold>Back</bold></yellow>"
          lore:
            - "<gray>Return to main menu"
          action: OPEN_MENU
          menu: main
        close:
          slot: 53
          material: STRUCTURE_VOID
          name: "<red><bold>Close</bold></red>"
          lore:
            - "<gray>Close this menu."
          action: CLOSE
