# PvPIndex Factions — Configuration
# Restart required for most changes. Reload with /fa reload.
# Database settings have moved to database.yml.

factions:
  max-members: 50
  max-warps: 10
  max-team-chests: 1
  max-allies: 5
  max-truces: 5
  team-chest:
    default-name: default
  invites:
    # Pending invite lifetime. Expired invites are auto-pruned on login/list/join.
    ttl-hours: 72
  language:
    # Server default locale for faction messages.
    # Players may override with /f language <code>.
    default: en
    # Allow players to set a personal language override.
    allow-player-override: true
    # Open the language GUI when running /f language with no args.
    command-opens-gui: true
    # Re-open the language GUI after /f language <code> or /f language reset.
    command-open-gui-after-set: true
    # Optional whitelist of locales shown/selectable in command suggestions and GUI.
    # Empty list means all loaded locales are available.
    visible-locales: []

  power:
    # Maximum power each online player contributes to the faction.
    per-player-max: 10.0
    # Power regenerated per second while the player is online.
    regen-per-second: 0.1
    # Power lost when a player dies in enemy or war-zone territory.
    loss-on-death: 4.0
    # Seconds after server start before power-loss on death is enforced.
    grace-period-seconds: 3600
    # Interval between power-tick updates.
    tick-interval-seconds: 60
    # Power gained by a player killer when they kill an enemy player.
    gain-on-kill:
      enabled: true
      amount: 2.0
      # Scale the kill reward by the power ratio between victim and killer.
      # Killing a more powerful enemy gives up to max-factor × base reward;
      # killing a weaker enemy gives as little as min-factor × base reward.
      scale:
        enabled: false
        min-factor: 0.25
        max-factor: 2.0
    # Players offline longer than this threshold are excluded from the faction
    # max-land calculation. Their stored power is unchanged; only the land-cap
    # computation skips them. Discourages dead factions from holding territory.
    inactive-exclusion:
      enabled: false
      days: 7
    # Multiply power loss for consecutive deaths within a short window.
    # Streak 0 = first death (no penalty). Streak 1 = loss × multiplier, etc.
    death-streak:
      enabled: false
      window-seconds: 600
      multiplier: 1.5
    # Optional opt-in: allow players to purchase additional personal power with money.
    buy:
      enabled: false
      cost-per-point: 100.0
      max-per-purchase: 5.0
    # Source-specific controls for power changes.
    sources:
      regen-online:
        enabled: true
        amount: 6.0
      regen-offline:
        enabled: true
        amount: 3.0
      death-loss:
        enabled: true
        amount: 4.0
      kill-gain:
        enabled: true
        amount: 2.0
      buy:
        enabled: true
    constraints:
      min-power: 0.0
      max-power: 10.0
      # 0 disables per-event clamp.
      max-change-per-event: 0.0
    multipliers:
      worlds: {}
      zones:
        safezone: 1.0
        warzone: 1.0
        own_claimed: 1.0
        enemy_claimed: 1.0
        wilderness: 1.0
    freeze:
      blocks-automatic: true
      blocks-regen: true
      allow-admin-bypass: true
    notifications:
      actor: true
      faction: false
      staff: false

  map:
    # Radius used by /f map once rendering.
    once-radius: 3

  list:
    # Entries per page for /f list.
    page-size: 8

  top:
    # Entries per page for /f top.
    page-size: 8

  info:
    relations:
      # Show allies in /f info.
      show-allies: true
      # Optionally include additional relation types in /f info.
      show-truces: false
      show-neutrals: false
      show-enemies: false

  land:
    # Minimum buffer (in chunks) between two enemy factions' territory.
    # 0 = disabled.
    buffer-zone: 0
    # A single /f claim command may claim at most this many chunks
    # when using fill/circle/square modes.
    max-per-command: 200

  economy:
    enabled: true
    # Cost (in server economy units) to create a faction.
    cost-create: 50.0
    # Cost per chunk claimed.
    cost-claim: 100.0

    tax:
      enabled: false
      # Fraction of faction bank balance deducted each interval.
      rate: 0.05
      interval-hours: 24
      # Do not tax factions with bank below this amount.
      min-bank-balance: 0.0
      # Skip tiny deductions below this amount.
      min-charge-amount: 0.01
    bank:
      history:
        # Entries per page for /f bank history.
        page-size: 8

  warp:
    list:
      # Entries per page for /f warp list.
      page-size: 8

  audit:
    # Entries per page for /f audit and /fa audit.
    page-size: 10

  fly:
    enabled: true
    # Cancel faction flight when an enemy enters the chunk.
    disable-on-threat: true
    # Players can only fly inside their own faction's territory.
    require-own-territory: true

  flags:
    # Per-faction toggleable behaviour flags.
    # Officers can toggle flags via /f flag set unless player-editable: false.
    pvp:
      # Allow PvP inside this faction's claimed territory.
      default: true
      player-editable: true
    friendly-fire:
      # Allow faction members to harm each other anywhere.
      default: false
      player-editable: true
    explosions:
      # Allow explosions to destroy terrain in this faction's territory.
      default: false
      player-editable: true
    fire-spread:
      # Allow fire to spread inside this faction's territory.
      default: false
      player-editable: true
    open:
      # Allow any player to join this faction without a pending invite.
      default: false
      player-editable: true

  # For advanced chat options this project will be updated soon:
  # https://github.com/JeremyFail/FactionsChat
  chat:
    # Show faction tag before player name in global chat.
    show-tag: false
    # MiniMessage format - placeholders: {faction_name}, {rank_prefix}
    tag-format: "<gray>[<gold>{faction_name}</gold>]</gray> "

  metrics:
    bstats:
      # Enable anonymous bStats metrics collection.
      enabled: true

  updates:
    # Check for new plugin versions on startup.
    enabled: true
    # Notify op players about available updates when they join.
    notify-ops-on-join: true

  zones:
    safe-zone:
      # No PvP, no building. Only admins can assign chunks with /fa safezone.
      enabled: true
    war-zone:
      # PvP always on, no building. Only admins can assign chunks with /fa warzone.
      enabled: true

  overclaiming:
    # When enabled, enemies can claim land from factions whose power dropped below their claim count.
    enabled: false
    # Require ENEMY relation before a faction can overclaim the other's land.
    require-enemy-relation: true
    # Block overclaiming when the defending faction has zero members currently online.
    # Prevents pure offline raiding.
    offline-protection:
      enabled: false

  raidable:
    # Notify faction members (and optionally the entire server) when their faction
    # transitions between raidable and safe during a power tick.
    broadcast:
      enabled: true
      server-wide: false

  war:
    # Daily time-of-day protection window. When active, the faction's land cannot be
    # overclaimed. The window is specified in UTC hours (0–23).
    shield:
      enabled: false
      # Maximum window length an admin may assign to a single faction.
      max-duration-hours: 8

  merge:
    # Allow factions to send and accept merge requests via /f merge send / /f merge accept.
    # When disabled, both commands are blocked regardless of permission.
    enabled: false

# Soft-integration toggles. The plugin checks for the provider plugin at startup
# and gracefully disables the integration if it is absent.
integrations:
  vault: true
  worldguard: true
  # When true, faction claim chunks are mirrored as WorldGuard ProtectedCuboidRegions so that
  # WG handles block-break/place protection natively (no per-event database query for members).
  # Requires WorldGuard to be installed. Restart required when toggling.
  worldguard-sync-regions: false
  dynmap: true
  placeholderapi: true
  essentialsx:
    # When true and EssentialsX is installed, /f home teleports through EssentialsX.
    enabled: false
  lwc:
    # Master toggle for LWC/LWCX interop.
    enabled: true
    # Block creating protections when the creator lacks faction build rights.
    require-build-rights-to-create: true
    # Remove stale protections on interact when owner no longer has build rights.
    remove-if-no-build-rights: true
    # Remove alien protections after successful chunk ownership changes.
    remove-on-claim-change: true
  discordsrv:
    # Set to true to broadcast faction events to a Discord channel via DiscordSRV.
    enabled: false
    # Discord text-channel ID to post to. Leave empty to use DiscordSRV's main linked channel.
    channel-id: ""
    events:
      faction-created:
        enabled: true
        message: "**{faction}** was founded!"
      faction-disbanded:
        enabled: true
        message: "**{faction}** was disbanded."
      relation-ally:
        enabled: true
        message: ":handshake: **{source}** and **{target}** are now allies!"
      relation-truce:
        enabled: true
        message: ":white_flag: **{source}** and **{target}** agreed to a truce."
      relation-enemy:
        enabled: true
        message: ":crossed_swords: **{source}** declared war on **{target}**!"
